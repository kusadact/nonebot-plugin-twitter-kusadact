[project]
name = "nonebot-plugin-twitter"
version = "0.3.1"
description = "NoneBot2 plugin for twitter"
authors = [
    {name = "nek0us", email = "nekouss@gmail.com"},
]
license = {text = "MIT"}
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.1.3", "httpx[http2]>=0.28.1", "nonebot_plugin_apscheduler>=0.2.0", "beautifulsoup4>=4.11.1", "nonebot_plugin_sendmsg_by_bots>=0.0.4", "playwright", "starlette>=0.27.0"]
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
preview = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/kusadact/nonebot-plugin-twitter-kusadact"
Repository = "https://github.com/kusadact/nonebot-plugin-twitter-kusadact"

[build-system]
requires = ["pdm-pep517>=0.12.0"]
build-backend = "pdm.pep517.api"

[tool.pdm.build]
source-includes = ["docs/", "tools/", "tests/", "requirements*.txt", ".env.example", "preview-routes.example.json"]
